name: CI
jobs:
  test:
    timeout-minutes: 30
    strategy:
      matrix:
        go:
        - stable
        os:
        - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ matrix.go }}
    - name: Test
      run: go test ./... -coverprofile=coverage.txt
    env:
      GOPROXY: https://proxy.golang.org|direct
  publish-validated-native-binaries:
    if: ${{ !inputs.test_only }}
    needs: test
    uses: ./.github/workflows/build.yml
    secrets: inherit
'on':
  workflow_dispatch:
    inputs:
      test_only:
        description: Run tests without creating tags, editing README or publishing binaries
        type: boolean
        default: false
permissions:
  contents: write
